name: Release (TestPyPI)

# G18.install: publish the sdist and wheel to TestPyPI, then install the
# published version from TestPyPI on Linux, macOS and Windows and smoke-test
# it. Needs the repository secret TEST_PYPI_API_TOKEN (a TestPyPI API token).
# Each install job writes its JSON result to the job summary; the G18 gate
# reads them from artifacts/release/TESTPYPI-INSTALL.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install "uv==0.8.17" "twine>=6,<7"
      - name: Check the lockfile and the citation file
        run: |
          uv lock --check
          python -m pip install "cffconvert==2.0.0"
          cffconvert --validate -i CITATION.cff
      - name: Read the version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version $version" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Check the distributions
        run: python -m twine check --strict dist/*
      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: >-
          python -m twine upload --skip-existing
          --repository-url https://test.pypi.org/legacy/ dist/*

  install:
    name: Install from TestPyPI on ${{ matrix.os }}
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the smoke script
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          sparse-checkout: scripts/release_smoke.py
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install the release from TestPyPI
        shell: bash
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/release"
          if [ -x "$RUNNER_TEMP/release/bin/python" ]; then
            py="$RUNNER_TEMP/release/bin/python"
          else
            py="$RUNNER_TEMP/release/Scripts/python.exe"
          fi
          echo "RELEASE_PYTHON=$py" >> "$GITHUB_ENV"
          for attempt in 1 2 3 4 5 6; do
            if "$py" -m pip install --no-cache-dir \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple/ \
                "formamech[runtime]==$VERSION"; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Smoke-test the installed release
        shell: bash
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          cp scripts/release_smoke.py "$RUNNER_TEMP/release_smoke.py"
          cd "$RUNNER_TEMP"
          "$RELEASE_PYTHON" -I release_smoke.py --expect-version "$VERSION"
