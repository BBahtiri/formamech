name: Mutation signatures

# G16.regression: on every release, run the twenty S16 mutants and compare
# their fired-gate signatures with the committed baseline. A lost primary
# detection or a lost secondary detection (coverage regression) fails the job.

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signatures:
    name: Mutation signatures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,geometry,physics,fem,ml]"
      - name: Run the mutants and compare with the committed baseline
        run: >
          python -m campaigns.dogbone_v1.s16_mutation run
          --report mutation-report.json
          --signatures mutation-signatures.json
          --compare artifacts/mutation/S16-SIGNATURES.json
      - name: Summarise the comparison
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("mutation-report.json")
          if not path.exists():
              print("No mutation report was written.")
          else:
              report = json.loads(path.read_text())
              comparison = report.get("comparison", {})
              print(f"## Mutation signatures: {comparison.get('status', 'NOT_RUN')}")
              print(f"Primary gates fired: {report['primary_fired']}/{report['mutant_count']}")
              for item in comparison.get("mutants", []):
                  if item["status"] != "PASS" or item["new_detections"]:
                      print(
                          f"- {item['name']}: {item['status']}; lost "
                          f"{item['lost_secondary']}; new {item['new_detections']}"
                      )
          PY
