name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,geometry,physics,fem,ml]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type-check
        run: python -m mypy --strict src/
      - name: Build documentation (strict)
        run: python -m mkdocs build --strict -f docs/mkdocs.yml -d ../site
      - name: Test with coverage
        run: python -m pytest --cov=src/piginot --cov-fail-under=90
      - name: Check S2 contract coverage
        run: python -m pytest tests/contracts --cov=src/piginot/contracts --cov-fail-under=90
      - name: Check S3 store coverage
        run: python -m pytest tests/store --cov=src/piginot/store --cov-fail-under=85
      - name: Check S4 physics coverage
        run: python -m pytest tests/physics --cov=src/piginot/physics --cov-fail-under=95
      - name: Check S5 geometry coverage
        run: python -m pytest tests/geometry --cov=src/piginot/geometry --cov-fail-under=85
      - name: Check S6 morphing coverage
        run: python -m pytest tests/morphing --cov=src/piginot/morphing --cov-fail-under=85
      - name: Check S8 FEM coverage
        run: python -m pytest tests/fem --cov=src/piginot/fem --cov-fail-under=85
      - name: Check S9 DOE coverage
        run: python -m pytest tests/doe tests/test_s9_anti_scope.py --cov=src/piginot/doe --cov-fail-under=90
      - name: Check S11 operator coverage
        run: python -m pytest tests/operators --cov=src/piginot/operators --cov-fail-under=80
      - name: Check S12 objective coverage
        run: python -m pytest tests/objectives --cov=src/piginot/objectives --cov-fail-under=85
      - name: Check S13 training coverage
        run: python -m pytest tests/training tests/test_s13_anti_scope.py --cov=src/piginot/training --cov-fail-under=80
      - name: Check S14 verification coverage
        run: python -m pytest tests/verification tests/campaigns/test_dogbone_s14_envelope.py tests/test_s14_anti_scope.py --cov=src/piginot/verification --cov-fail-under=85
      - name: Check S16 mutation engine coverage
        run: python -m pytest tests/mutation tests/test_s16_anti_scope.py --cov=src/piginot/mutation --cov-fail-under=85
      - name: Check S20 evaluation harness coverage
        run: python -m pytest tests/evaluation --cov=src/piginot/evaluation --cov-fail-under=90
      - name: Check S21 certificate coverage
        run: python -m pytest tests/certify --cov=src/piginot/certify --cov-fail-under=90
      - name: Audit dependencies
        run: python -m pip_audit

  release-metadata:
    name: Lockfile, citation and distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install tools
        run: python -m pip install "uv==0.8.17" "twine>=6,<7" "cffconvert==2.0.0"
      - name: The lockfile is current and tool-generated
        run: uv lock --check
      - name: CITATION.cff validates
        run: cffconvert --validate -i CITATION.cff
      - name: Build and check sdist and wheel
        run: |
          uv build --out-dir dist
          python -m twine check --strict dist/*

  example1:
    name: Example 1 (fixed-mesh strain sweep, < 10 minutes)
    runs-on: ubuntu-latest
    # The example itself fails when its run exceeds 600 s; the job limit
    # also covers installing torch.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fem,ml]"
      - name: Run Example 1 end to end
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m examples.fixed_mesh_sweep.sweep --output example1-output
