name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,geometry,physics,fem]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type-check
        run: python -m mypy --strict src/
      - name: Test with coverage
        run: python -m pytest --cov=src/piginot --cov-fail-under=90
      - name: Check S2 contract coverage
        run: python -m pytest tests/contracts --cov=src/piginot/contracts --cov-fail-under=90
      - name: Check S3 store coverage
        run: python -m pytest tests/store --cov=src/piginot/store --cov-fail-under=85
      - name: Check S4 physics coverage
        run: python -m pytest tests/physics --cov=src/piginot/physics --cov-fail-under=95
      - name: Check S5 geometry coverage
        run: python -m pytest tests/geometry --cov=src/piginot/geometry --cov-fail-under=85
      - name: Check S6 morphing coverage
        run: python -m pytest tests/morphing --cov=src/piginot/morphing --cov-fail-under=85
      - name: Check S8 FEM coverage
        run: python -m pytest tests/fem --cov=src/piginot/fem --cov-fail-under=85
      - name: Check S9 DOE coverage
        run: python -m pytest tests/doe tests/test_s9_anti_scope.py --cov=src/piginot/doe --cov-fail-under=90
      - name: Audit dependencies
        run: python -m pip_audit
