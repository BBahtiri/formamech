[build-system]
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "formamech"
version = "0.2.0.dev0"
description = "Physics-informed models and FEM workflows for user-owned 2D CAD geometry"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Betim Bahtiri" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["rfc8785>=0.1.4,<0.2"]

[project.urls]
Repository = "https://github.com/BBahtiri/formamech"
Documentation = "https://github.com/BBahtiri/formamech/tree/main/docs"

[project.optional-dependencies]
fem = [
  "numpy>=1.26,<2.3",
  "scikit-fem>=11,<13",
  "scipy>=1.12,<2",
  "sympy>=1.13,<2",
  "torch>=2.6,<3",
]
geometry = ["meshio>=5.3.5,<6", "numpy>=1.26,<2.3"]
cad = ["gmsh>=4.15.2,<5", "ezdxf>=1.4.5,<2", "numpy>=1.26,<2.3"]
physics = ["torch>=2.6,<3"]
ml = ["torch>=2.6,<3", "safetensors>=0.8,<1"]
runtime = ["numpy>=1.26,<2.3", "torch>=2.6,<3", "safetensors>=0.8,<1"]
plot = ["matplotlib>=3.9,<4", "numpy>=1.26,<2.3"]
ui = ["streamlit>=1.51,<2", "plotly>=5.24,<7"]
mcp = ["mcp>=1.6,<2"]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
scale = ["pyamg>=5.2,<6"]
verify = [
  "numpy>=1.26,<2.3",
  "threadpoolctl>=3.1,<4",
  "torch>=2.6,<3",
  "safetensors>=0.8,<1",
  "scikit-fem>=11,<13",
  "scipy>=1.12,<2",
  "sympy>=1.13,<2",
]
dev = [
  "mkdocs>=1.6,<2",
  "mypy>=1.15,<3",
  "pip-audit>=2.8,<3",
  "pre-commit>=4.1,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "setuptools>=83",
]

[project.scripts]
formamech = "formamech.cli:main"
piginot = "piginot.cli:main"

[project.entry-points."piginot.compiler.adapters"]
dogbone-v1 = "piginot_campaigns.adapters:DOGBONE"
notched-v1 = "piginot_campaigns.adapters:NOTCHED"
cad-fixed-v1 = "piginot.cad.adapter:FIXED_CAD"
cad-parametric-v1 = "piginot.cad.parametric_adapter:PARAMETRIC_CAD"

[project.entry-points."formamech.fem.backends"]
scikit-fem = "piginot.fem.backend:ScikitFemBackend"
torch-fem = "piginot.fem.torch_backend:TorchFemBackend"
scikit-fem-3d = "piginot.fem.backend_3d:ScikitFemBackend3D"
torch-fem-3d = "piginot.fem.backend_3d:TorchFemBackend3D"

[tool.hatch.build]
exclude = ["/experiments"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/formamech", "src/piginot", "piginot_campaigns"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/frontend/boundary-picker/node_modules",
  "/frontend/boundary-picker/coverage",
  "/frontend/viewer-3d/node_modules",
  "/frontend/viewer-3d/coverage",
]
only-include = [
  "/src/formamech",
  "/src/piginot",
  "/piginot_campaigns",
  "/frontend/boundary-picker",
  "/frontend/viewer-3d",
  "/LICENSE",
  "/README.md",
  "/CITATION.cff",
  "/CHANGELOG.md",
  "/pyproject.toml",
  "/hatch_build.py",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
  "experiments/spike/_closeout_phaseA",
  "experiments/spike/_closeout_phaseB",
  "experiments/spike/_closeout_phaseC",
  "experiments/spike/upstream_pi_ginot",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
