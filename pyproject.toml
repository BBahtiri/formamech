[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "piginot"
version = "0.1.0"
description = "Verified, problem-specific physics-informed neural operators for 2D finite-strain elasticity"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PI-GINOT contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
fem = ["scikit-fem>=11,<13"]
ml = ["torch>=2.6,<3"]
dev = [
  "mkdocs>=1.6,<2",
  "mypy>=1.15,<3",
  "pip-audit>=2.8,<3",
  "pre-commit>=4.1,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "setuptools>=83",
]

[project.scripts]
piginot = "piginot.cli:main"

[tool.hatch.build]
exclude = ["/experiments"]

[tool.hatch.build.targets.wheel]
packages = ["src/piginot"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
