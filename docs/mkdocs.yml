  - Architecture and lineage: architecture.md
  - User guide: user-guide.md
  - Limitations: limitations.md
  - Examples: examples.md
  - Benchmarks: benchmarks.md
  - Bundles: bundle.md
  - Problem specification: problem-spec.md
  - Advanced workflows (P1-P6): advanced-workflows.md
  - Specialized workflows:
      - Model qualification: qualification.md
      - Interactive workbench: workbench.md
      - J2 elastoplasticity: plasticity.md
      - Parametric CAD exploration: parametric_cad.md
      - 3D CAD and nonlinear FEM: workflow_3d.md
      - Industrial 3D scaling & copilot (v0.3): v3-capabilities.md
      - AI-Ready Agent Harness & 3D Production Suite (v0.4): v4-agent-harness.md
      - Production Trust, Hybrid Grounding & ETM Multiphysics (v0.5): v5-production-gap.md
  - Train with your own inputs:
      - Own 2D CAD: campaigns/own-cad-workflow.md
      - Meshing and FEM convergence: campaigns/own-cad-meshing.md
      - Campaign compiler: campaigns/s28-compiler-guide.md
      - Custom materials: campaigns/s29-custom-material.md
      - Bundle prediction demo: campaigns/s29-fast-demo.md
  - Upstream sources and licences: adr/upstream-sources.md

theme:
  name: readthedocs
