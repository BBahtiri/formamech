site_name: FormaMech
site_description: Documentation for the FormaMech project
docs_dir: .
site_dir: ../site
strict: true

exclude_docs: |
  adr/*.md
  !adr/upstream-sources.md
  design/
  fork/
  specs/
  campaigns/*.md
  !campaigns/own-cad-workflow.md
  !campaigns/own-cad-meshing.md
  !campaigns/s28-compiler-guide.md
  !campaigns/s29-custom-material.md
  !campaigns/s29-fast-demo.md

nav:
