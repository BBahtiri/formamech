<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
<title id="title">S11 contingency: frozen TRAIN-screen errors</title>
<desc id="description">Four architecture candidates compared on 64 held-aside TRAIN cases. Lower bars are better. Candidate C improves every stress metric but exceeds the displacement regression guardrail, so the formal result falls back to candidate A.</desc>
